# =============================================================================
# Nombre: ci-cd.yml
# Descripción: Pipeline CI/CD de SIGIF (REQ-F-042 a REQ-F-047): detecta cambios, ejecuta pruebas
#              unitarias, de integración (PostgreSQL), E2E (Playwright/Selenium) y de carga (k6);
#              despliega a producción si todo pasa; si algo falla cancela el despliegue, crea un
#              issue y notifica al equipo; genera reportes de cumplimiento, pendientes y cambios.
# Fecha de creación: 21/10/2026
# Última actualización: 21/10/2026
# Autor: Equipo SIGIF
# =============================================================================
name: SIGIF CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write
  checks: write

concurrency:
  group: sigif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-End (JUnit + Mockito + Spring Boot Test + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas unitarias e integración
        run: mvn -B verify
      - name: Javadoc
        run: mvn -B -q javadoc:javadoc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/failsafe-reports/*.xml

  frontend:
    name: Front-End (build + JSDoc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run docs

  e2e:
    name: E2E (Playwright + Selenium) y carga (k6)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar entorno completo
        run: docker compose up -d --build
      - name: Esperar a que el API esté disponible
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/v1/auth/login \
              -H 'Content-Type: application/json' -d '{"username":"x","password":"x"}' || true)
            [ "$code" = "401" ] && exit 0
            sleep 5
          done
          docker compose logs backend
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Selenium
        working-directory: frontend
        run: npm run test:selenium
      - uses: grafana/setup-k6-action@v1
      - name: Prueba de carga (ventas concurrentes)
        run: k6 run -e BASE_URL=https://localhost pruebas-carga/ventas-concurrentes.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-e2e
          path: |
            frontend/test-results/
            frontend/playwright-report/

  reportes:
    name: Reportes de cumplimiento, pendientes y cambios por integrante
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generar reportes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PIPELINE_RESULTADO: ${{ needs.e2e.result }}
        run: node scripts/reportes/generar-reportes.mjs artefactos reportes
      - name: Publicar resumen
        run: cat reportes/resumen.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reportes-ingenieria
          path: reportes/

  desplegar:
    name: Pase a producción
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: produccion
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imágenes
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for app in backend frontend; do
            docker build -t ghcr.io/$OWNER/sigif-$app:${{ github.sha }} -t ghcr.io/$OWNER/sigif-$app:latest ./$app
            docker push --all-tags ghcr.io/$OWNER/sigif-$app
          done
      - name: Desplegar en el servidor de producción
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "$DEPLOY_KEY" > clave && chmod 600 clave
          ssh -o StrictHostKeyChecking=accept-new -i clave "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/sigif && docker compose pull && docker compose up -d"

  notificar-fallo:
    name: Generar issue y comunicar fallo
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: failure()
    env:
      WEBHOOK: ${{ secrets.TEAM_WEBHOOK_URL }}
    steps:
      - name: Crear issue con el detalle del fallo
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId });
            const fallidos = jobs.jobs.filter(j => j.conclusion === 'failure').map(j => `- ${j.name}`).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fallo en pruebas CI/CD (${context.sha.substring(0, 7)}) - despliegue cancelado`,
              body: `El pipeline falló y **no se desplegó a producción**.\n\nCommit: ${context.sha}\nAutor: @${context.actor}\nRama: ${context.ref}\n\nJobs fallidos:\n${fallidos}\n\nEjecución: ${run}`,
              labels: ['ci-fallo', 'bug'],
              assignees: [context.actor],
            });
      - name: Notificar al equipo (webhook opcional de Slack/Teams)
        if: env.WEBHOOK != ''
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"❌ SIGIF: falló el pipeline en ${{ github.ref_name }} (${{ github.sha }}) por ${{ github.actor }}. Despliegue cancelado. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"
